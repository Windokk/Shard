name: reflection

# The *.reflection.hpp files are generated by ShardReflect from the CLASS() / STRUCT() / FIELD() annotations of the
# headers, and committed (the main build does not need LLVM). This regenerates them all and fails when the result differs
# from what is committed : a reflected class changed without its reflection file following, or a generated file edited
# by hand (what a field needs, such as a range, goes in its FIELD() annotation instead).
#
# Run on Windows : it is where the committed files come from (MinGW-w64 + the clang of MSYS2).

on:
  push:
  pull_request:
  workflow_dispatch:

# A push and its pull request share one group, and a newer commit cancels the run of an older one
concurrency:
  group: reflection-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-reflection:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: 'msys2 {0}'

    env:
      CC: gcc
      CXX: g++

    steps:
      # The third-party headers (glm, json, jolt, freetype...) are git submodules : the tool parses the engine headers with them
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the MinGW-w64 toolchain and LLVM / Clang
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm

      # The CMake files expect the build folder to be named "build" (like build.sh / build.bat)
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ShardReflect
        run: cmake --build build --target ShardReflect --parallel

      - name: Regenerate the reflection files
        run: bash scripts/regen_reflection.sh

      # Git for Windows' bash : the MSYS2 environment has no git. The tool writes CRLF on Windows, only the content counts.
      - name: Fail if a reflection file is stale
        shell: bash
        run: |
          stale=0

          if ! git diff --ignore-cr-at-eol --exit-code -- '*.reflection.hpp'; then
            stale=1
          fi

          untracked="$(git ls-files --others --exclude-standard -- '*.reflection.hpp')"
          if [ -n "$untracked" ]; then
            echo "Generated, but not committed :"
            echo "$untracked"
            stale=1
          fi

          if [ "$stale" -ne 0 ]; then
            echo "::error title=Stale reflection files::The *.reflection.hpp files differ from what ShardReflect generates (diff above). Run scripts/regen_reflection.sh (see src/apps/tools/reflect/README.md) and commit the result."
            exit 1
          fi

          echo "The reflection files are up to date."
