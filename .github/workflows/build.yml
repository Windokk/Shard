name: build

# Builds the whole engine (layers, editor, player, headless runner, game module, tests) on Windows AND Linux, then runs the tests
# (among them a headless replay : the simulation has to end in the same state on both), and on Linux boots the player on
# example_project (smoke test).
# A red run means a change broke one of the two platforms (or a test, or the engine's boot).

on:
  push:
  pull_request:
  workflow_dispatch:

# A push and its pull request share one group, and a newer commit cancels the run of an older one
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    # The "matrix" : the job below is run once per entry, in parallel, each on its own fresh machine
    strategy:
      fail-fast: false # a failure on one platform does not cancel the other : we want to see both results
      matrix:
        include:
          # The names are matched exactly by the README badges (nameFilter), keep them in sync
          - name: Windows # MinGW-w64 GCC + Ninja
            runner: windows-latest
            shell: 'msys2 {0}'
          - name: Linux # GCC + Ninja
            runner: ubuntu-24.04 # pinned : "ubuntu-latest" moves to Ubuntu 26 on 2026-10-19, with other compiler / package versions
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      # GCC on both platforms (the CMake files link with GNU-style flags such as -lz, which MSVC does not understand)
      CC: gcc
      CXX: g++

    steps:
      # The third-party libraries (SDL3, Jolt, glm, imgui...) are git submodules : they are not part of the repository itself
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same script as for a developer on Debian / Ubuntu : ninja, zlib, and what SDL3 needs for its X11 / Wayland / audio / input backends
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_deps.sh

      # Clang and wasm-ld : the sandboxed test plugin is built for wasm32 and run by the engine (WasmSdkPluginTest, Wasm.SdkSignatures).
      # Without them those tests are skipped, not failed. (Wasmtime itself is a prebuilt archive CMake downloads, cmake/ShardWasmtime.cmake.)
      # The wasi-sdk 34 libc++ needs Clang 21 or later (it uses #pragma clang attribute with __visibility__) : the Ubuntu one is too old,
      # so LLVM 21 comes from apt.llvm.org, and clang / clang++ / wasm-ld (the names the CMake files look for) are put on the PATH.
      - name: Install Clang and wasm-ld (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y --no-install-recommends lld-21
          sudo ln -sf "$(command -v clang-21)" /usr/local/bin/clang
          sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
          sudo ln -sf "$(command -v wasm-ld-21)" /usr/local/bin/wasm-ld
          clang++ --version

      - name: Install the MinGW-w64 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld

      # Same manual step as in the README ("Modify imgui submodule to use our vulkan.h") : without it the editor does not compile
      - name: Patch imgui to use the engine's vulkan.h
        run: bash scripts/patch_imgui.sh

      # The CMake files expect the build folder to be named "build" (like build.sh / build.bat).
      # Release : Debug (the default) is -O0, far slower for Jolt and the engine. ShardReflect is skipped (the generated
      # *.reflection.hpp files are committed, reflection.yml checks that they are up to date).
      # The wasi-sdk sysroot (libc, libc++, compiler-rt) : the game of tests/plugin_fixtures/game_scripts is built to WebAssembly with the SDK's
      # TARGET wasm and run in the sandbox (WasmGameTest). Pinned by SHA-256 in the script.
      - name: wasi sysroot (for the sandboxed game)
        run: bash scripts/install_wasi_sysroot.sh "$RUNNER_TEMP/wasi" | tee wasi.env

      - name: Configure
        run: |
          . ./wasi.env
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHARD_BUILD_REFLECT=OFF -DSHARD_TEST_WASM_TOOLCHAIN="$SHARD_WASM_TOOLCHAIN" -DSHARD_WASM_BUILTINS="$SHARD_WASM_BUILTINS"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      # The simulation regression test (also part of the step above : it is run alone here so that its result has a line of
      # its own). ShardHeadless plays tests/determinism/golden/determinism.replay back : no window, no GPU, no sound card, and
      # every state check of the replay has to hash to the recorded value, on Windows AND on Linux. A failure on one platform only
      # means something in the simulation depends on the platform (see docs/docs/headless.md).
      - name: Determinism (headless replay, no GPU)
        run: ctest --test-dir build -R "^Determinism\." --output-on-failure --timeout 300

      # The C ABI is the promise that a plugin works whatever compiler built it (docs/design-notes/c-abi-sdk.fr.md, A5). The step "Test"
      # already ran Sdk.OutOfTree : the SDK installed alone, the template of sdk/templates/plugin built against it outside the repository, and
      # loaded by the headless engine. Here the template is built by ANOTHER compiler than the engine's : Clang against the GCC engine on
      # Linux, MSVC against the MinGW engine on Windows.
      - name: SDK, plugin built by Clang (engine built by GCC)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DSHARD_SDK_TEST_CXX=clang++
          ctest --test-dir build -R "^Sdk\.OutOfTree$" --output-on-failure --timeout 400

      - name: SDK, plugin built by MSVC (engine built by MinGW GCC)
        if: runner.os == 'Windows'
        run: |
          VS="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')"
          cmake -S . -B build "-DSHARD_SDK_TEST_VCVARS=$(cygpath -m "$VS")/VC/Auxiliary/Build/vcvars64.bat"
          ctest --test-dir build -R "^Sdk\.OutOfTreeMsvc$" --output-on-failure --timeout 400

      # The SDK of this commit (headers, CMake package, template, ShardPkg) as shard-sdk-<version>.zip : what a plugin author downloads.
      # One per OS : the headers are the same, ShardPkg is not.
      - name: SDK archive
        run: cmake --build build --target ShardSDKArchive

      - name: Upload the SDK archive
        uses: actions/upload-artifact@v4
        with:
          name: shard-sdk-${{ runner.os }}
          path: build/shard-sdk-*.zip
          if-no-files-found: error

      # The smoke test starts the player on example_project (scripts/smoke_test.sh). The runner has no GPU : on a virtual
      # display (Xvfb) OpenGL comes from Mesa's software renderer. Linux only : a Windows runner offers no OpenGL 4.6 at all.
      # llvmpipe only goes up to GL 4.5, so MESA_GL_VERSION_OVERRIDE is needed to get a 4.6 context.
      - name: Install the virtual display and the software OpenGL
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0

      - name: Smoke test (boot the engine, load example_project)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.6'
        run: bash scripts/smoke_test.sh
