name: layering

on:
  push:
  pull_request:

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      # Fails if a module depends on a higher layer or on a peer more than the committed baseline allows.
      - run: python scripts/check_deps.py
